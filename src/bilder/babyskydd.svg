<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration av ett babyskydd, bakåtvänt">
  <rect width="400" height="300" fill="#F4F2ED"/>

  <!-- Färdriktning -->
  <g stroke="#B9B3A7" stroke-width="2" fill="none">
    <line x1="40" y1="268" x2="330" y2="268"/>
    <polyline points="320,262 332,268 320,274" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="40" y="288" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#7A746A">Färdriktning</text>

  <!-- Bärhandtag, tydligt ovanför skalet -->
  <path d="M118 208 C 100 22, 284 8, 302 172" fill="none" stroke="#35594F" stroke-width="10" stroke-linecap="round"/>

  <!-- Skal: äggformat, lutar bakåt mot färdriktningen -->
  <path d="M112 232
           C 92 176, 112 116, 176 106
           C 250 95, 298 132, 300 178
           C 302 214, 274 236, 232 240
           L 140 244
           C 124 245, 116 240, 112 232 Z"
        fill="#4A7C6F"/>

  <!-- Insida / sittyta -->
  <path d="M140 214
           C 128 176, 146 134, 190 128
           C 244 120, 278 146, 280 180
           C 281 204, 262 218, 228 221
           L 156 224
           C 146 225, 142 221, 140 214 Z"
        fill="#F4F2ED" opacity="0.92"/>

  <!-- Internbälte -->
  <g stroke="#4A7C6F" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="176" y1="150" x2="212" y2="188"/>
    <line x1="238" y1="152" x2="212" y2="188"/>
    <circle cx="212" cy="194" r="8" fill="#4A7C6F" stroke="none"/>
  </g>

  <!-- Barnets huvud, mot bakre kanten -->
  <circle cx="168" cy="168" r="19" fill="#E2DED6"/>
</svg>
