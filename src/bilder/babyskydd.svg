<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Ikon av ett bakåtvänt babyskydd med bärhandtag">
  <!-- Bärhandtag, symmetrisk båge ovanför skalet -->
  <path d="M104 184 C 114 12, 254 12, 268 158"
        fill="none" stroke="#3E6B5F" stroke-width="9"
        stroke-linecap="round" opacity="0.5"/>

  <!-- Skalet som en djup skål: fotände, botten, ryggände -->
  <path d="M96 158 L 112 210 L 236 202 L 256 104"
        fill="none" stroke="#3E6B5F" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Insidan -->
  <path d="M110 162 L 124 197 L 230 190 L 246 118"
        fill="none" stroke="#EFEDE7" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barnets huvud, mot ryggänden -->
  <circle cx="226" cy="140" r="20" fill="#EFEDE7"/>

  <!-- Internbälte -->
  <g fill="none" stroke="#B5654A" stroke-width="6" stroke-linecap="round">
    <path d="M212 162 L 184 184"/>
    <path d="M240 166 L 184 184"/>
  </g>

  <!-- Färdriktning -->
  <g stroke="#C9C3B7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="70" y1="262" x2="290" y2="262"/>
    <polyline points="281,255 293,262 281,269"/>
  </g>
</svg>
