      <path d="M209,177 L248,200 L248,400 L300,400"></path>
    </g>

    
    <circle cx="60" cy="400" r="6" stroke="#6b6459" stroke-width="1.5" fill="none"></circle>
    <text x="60" y="414" text-anchor="middle" font-size="11.5" fill="#181614">Fungerar</text>
    <text x="60" y="427" text-anchor="middle" font-size="11.5" fill="#181614">nästan alltid</text>

    <circle cx="180" cy="400" r="6" fill="#B5581F" stroke="#F7F5F2" stroke-width="2"></circle>
    <text x="180" y="414" text-anchor="middle" font-size="11.5" fill="#181614">Längst från</text>
    <text x="180" y="427" text-anchor="middle" font-size="11.5" fill="#181614">krockzonerna</text>

    <circle cx="300" cy="400" r="6" stroke="#6b6459" stroke-width="1.5" fill="none"></circle>
    <text x="300" y="414" text-anchor="middle" font-size="11.5" fill="#181614">Bara med</text>
    <text x="300" y="427" text-anchor="middle" font-size="11.5" fill="#181614">urkopplad</text>
    <text x="300" y="440" text-anchor="middle" font-size="11.5" fill="#181614">krockkudde</text>

    
    <text x="180" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#181614">Krav för mittplatsen</text>

    <circle cx="44" cy="486" r="3" fill="#B5581F"></circle>
    <text x="56" y="490" font-size="12" fill="#6b6459">Trepunktsbälte på platsen</text>

    <circle cx="44" cy="508" r="3" fill="#B5581F"></circle>
    <text x="56" y="512" font-size="12" fill="#6b6459">Biltillverkaren godkänner platsen</text>

    <circle cx="44" cy="530" r="3" fill="#B5581F"></circle>
    <text x="56" y="534" font-size="12" fill="#6b6459">Stolen godkänd för montering där</text>
  </svg>