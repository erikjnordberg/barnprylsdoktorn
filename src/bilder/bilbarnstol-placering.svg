    <circle cx="220" cy="255" r="6" stroke="#6b6459" stroke-width="1.5" fill="none"></circle>

    
    <g stroke="#A8A29A" stroke-width="1" fill="none">
      <path d="M180,299 L180,400"></path>
      <path d="M140,296 L140,345 L60,345 L60,400"></path>
