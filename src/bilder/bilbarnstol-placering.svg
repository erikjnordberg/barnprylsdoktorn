      <line x1="176" y1="101" x2="180" y2="107"></line>
      <line x1="184" y1="101" x2="180" y2="107"></line>
    </g>

    
    <g stroke="#A8A29A" stroke-width="1.2" stroke-linecap="round" fill="none">
