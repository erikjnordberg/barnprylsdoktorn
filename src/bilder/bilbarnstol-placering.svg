    <circle cx="209" cy="171" r="6" stroke="#6b6459" stroke-width="1.5" fill="none"></circle>

    
    <rect x="120" y="214" width="120" height="82" rx="16" stroke="#181614" stroke-width="2" fill="none"></rect>
    <line x1="160" y1="216" x2="160" y2="294" stroke="#181614" stroke-width="1.2"></line>
