<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Source Sans 3, Segoe UI, system-ui, sans-serif" viewBox="0 0 360 575" width="100%" height="auto" role="img" aria-label="Bil sedd uppifrån som visar att mittplatsen i baksätet är bäst för en bilbarnstol eftersom den ligger längst från krockzonerna, att de yttre baksätena och framsätet med urkopplad krockkudde fungerar som alternativ, och att mittplatsen kräver trepunktsbälte, tillverkarens godkännande och en stol godkänd för montering där.">

    <text x="180" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#181614">Var ska bilbarnstolen sitta?</text>
    <text x="180" y="46" text-anchor="middle" font-size="11" fill="#6b6459">Bilen sedd rakt uppifrån</text>

    
    <g stroke="#A8A29A" stroke-width="1.2" stroke-linecap="round" fill="none">
