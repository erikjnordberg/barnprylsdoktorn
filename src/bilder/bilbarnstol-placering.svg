      <line x1="66" y1="219" x2="70" y2="215"></line>
      <line x1="66" y1="266" x2="70" y2="270"></line>
      <line x1="66" y1="274" x2="70" y2="270"></line>

      <line x1="290" y1="140" x2="290" y2="290"></line>
      <line x1="294" y1="156" x2="290" y2="160"></line>
      <line x1="294" y1="164" x2="290" y2="160"></line>
      <line x1="294" y1="211" x2="290" y2="215"></line>
      <line x1="294" y1="219" x2="290" y2="215"></line>
      <line x1="294" y1="266" x2="290" y2="270"></line>
      <line x1="294" y1="274" x2="290" y2="270"></line>
    </g>

    
    <rect x="110" y="60" width="140" height="320" rx="32" ry="32" stroke="#181614" stroke-width="2.5" fill="none" stroke-linejoin="round"></rect>
    <path d="M128,108 Q180,96 232,108" stroke="#181614" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
    <path d="M128,332 Q180,344 232,332" stroke="#181614" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
    <rect x="97" y="104" width="13" height="7" rx="3" stroke="#181614" stroke-width="1.5" fill="none"></rect>
    <rect x="250" y="104" width="13" height="7" rx="3" stroke="#181614" stroke-width="1.5" fill="none"></rect>

    
