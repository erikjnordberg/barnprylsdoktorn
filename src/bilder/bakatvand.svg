<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration av en bakåtvänd bilbarnstol med stödben">
  <rect width="400" height="300" fill="#F4F2ED"/>

  <!-- Färdriktning -->
  <g stroke="#B9B3A7" stroke-width="2" fill="none">
    <line x1="40" y1="268" x2="330" y2="268"/>
    <polyline points="320,262 332,268 320,274" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="40" y="288" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#7A746A">Färdriktning</text>

  <!-- Hög rygg, vänd mot färdriktningen (höger) -->
  <path d="M268 62
           C 296 62, 306 82, 304 108
           L 296 210
           C 294 226, 282 234, 266 234
           L 132 234
           C 116 234, 108 224, 110 208
           L 116 168
           C 118 152, 130 144, 146 144
           L 236 144
           L 244 84
           C 246 70, 254 62, 268 62 Z"
        fill="#4A7C6F"/>

  <!-- Sittyta -->
  <path d="M146 166 L 232 166 L 226 214 L 136 214 Z" fill="#F4F2ED" opacity="0.9"/>

  <!-- Ryggstöd insida -->
  <path d="M254 84 L 282 84 L 272 200 L 244 200 Z" fill="#F4F2ED" opacity="0.55"/>

  <!-- Barnets huvud, mot ryggstödet -->
  <circle cx="238" cy="118" r="21" fill="#E2DED6"/>

  <!-- Internbälte över axeln -->
  <g stroke="#35594F" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="228" y1="142" x2="198" y2="186"/>
    <line x1="176" y1="150" x2="198" y2="186"/>
    <circle cx="198" cy="192" r="8" fill="#35594F" stroke="none"/>
  </g>

  <!-- Stödben ner mot golvet -->
  <rect x="128" y="234" width="16" height="34" rx="4" fill="#35594F"/>
  <rect x="112" y="264" width="48" height="9" rx="4" fill="#35594F"/>
</svg>
