<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Ikon av en bakåtvänd bilbarnstol med hög rygg och stödben">
  <!-- Hög rygg åt höger, sits åt vänster -->
  <path d="M266 54 L 244 190 L 96 202"
        fill="none" stroke="#3E6B5F" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Insidan -->
  <path d="M256 72 L 238 180 L 114 191"
        fill="none" stroke="#EFEDE7" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barnets huvud, högt mot ryggstödet -->
  <circle cx="248" cy="96" r="22" fill="#EFEDE7"/>

  <!-- Internbälte över axeln -->
  <g fill="none" stroke="#B5654A" stroke-width="6" stroke-linecap="round">
    <path d="M234 124 L 206 158"/>
    <path d="M262 128 L 206 158"/>
  </g>

  <!-- Stödben mot golvet -->
  <path d="M112 216 L 112 246" stroke="#3E6B5F" stroke-width="10" stroke-linecap="round"/>
  <path d="M90 250 L 134 250" stroke="#3E6B5F" stroke-width="10" stroke-linecap="round"/>

  <!-- Färdriktning -->
  <g stroke="#C9C3B7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="164" y1="266" x2="300" y2="266"/>
    <polyline points="291,259 303,266 291,273"/>
  </g>
</svg>
