<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-label="Två stolar i genomskärning som jämför lutning: ett babyskydd lutar cirka 40 till 45 grader mot lodrätt, en bakåtvänd bilbarnstol 20 till 35 grader och sitter alltså mer upprätt">

  <g font-family="Source Sans 3, system-ui, sans-serif">

    <!-- Avdelare -->
    <line x1="180" y1="56" x2="180" y2="196" stroke="#A8A29A" stroke-width="1" fill="none"/>

    <!-- ===== Babyskydd: cirka 45 grader ===== -->
    <g>
      <!-- Lodrätt referens -->
      <line x1="65" y1="180" x2="65" y2="98" stroke="#A8A29A" stroke-width="1.5"
            stroke-dasharray="4 3" fill="none"/>
      <!-- Vinkelbåge -->
      <path d="M65 146 A 34 34 0 0 0 41 156" fill="none" stroke="#A8A29A" stroke-width="1.5"/>
      <!-- Sits -->
      <line x1="65" y1="180" x2="125" y2="184" stroke="#181614" stroke-width="7"
            stroke-linecap="round"/>
      <!-- Rygg, 45 grader från lodrätt -->
      <line x1="65" y1="180" x2="12" y2="127" stroke="#181614" stroke-width="7"
            stroke-linecap="round"/>
      <!-- Huvud -->
      <circle cx="12" cy="127" r="11" fill="#B5581F" stroke="#F7F5F2" stroke-width="3"/>
    </g>
    <text x="90" y="216" font-size="13.5" font-weight="600" fill="#181614" text-anchor="middle">Babyskydd</text>
    <text x="90" y="234" font-size="13" fill="#B5581F" text-anchor="middle">40–45°</text>

    <!-- ===== Bakåtvänd bilbarnstol: cirka 32 grader ===== -->
    <g>
      <line x1="265" y1="180" x2="265" y2="98" stroke="#A8A29A" stroke-width="1.5"
            stroke-dasharray="4 3" fill="none"/>
      <path d="M265 146 A 34 34 0 0 0 247 152" fill="none" stroke="#A8A29A" stroke-width="1.5"/>
      <line x1="265" y1="180" x2="325" y2="184" stroke="#181614" stroke-width="7"
            stroke-linecap="round"/>
      <!-- Rygg, cirka 32 grader från lodrätt -->
      <line x1="265" y1="180" x2="225" y2="116" stroke="#181614" stroke-width="7"
            stroke-linecap="round"/>
      <circle cx="225" cy="116" r="11" fill="#B5581F" stroke="#F7F5F2" stroke-width="3"/>
    </g>
    <text x="265" y="216" font-size="13.5" font-weight="600" fill="#181614" text-anchor="middle">Bakåtvänd bilbarnstol</text>
    <text x="265" y="234" font-size="13" fill="#B5581F" text-anchor="middle">20–35°</text>

    <!-- Fotnot -->
    <text x="180" y="254" font-size="11" fill="#6b6459" text-anchor="middle">Vinkeln mäts mot lodrätt</text>

  </g>
</svg>
