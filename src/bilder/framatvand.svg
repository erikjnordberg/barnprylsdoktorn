<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Ikon av en framåtvänd bältesstol med bilbältet över bröstet">
  <!-- Rygg åt vänster, sits åt höger -->
  <path d="M94 54 L 116 190 L 264 202"
        fill="none" stroke="#3E6B5F" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Insidan -->
  <path d="M104 72 L 122 180 L 246 191"
        fill="none" stroke="#EFEDE7" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barnets huvud -->
  <circle cx="112" cy="96" r="22" fill="#EFEDE7"/>

  <!-- Bilbältet diagonalt över bröstet och över höften -->
  <g fill="none" stroke="#B5654A" stroke-width="6" stroke-linecap="round">
    <path d="M120 126 L 194 178"/>
    <path d="M150 186 L 232 186"/>
  </g>

  <!-- Färdriktning -->
  <g stroke="#C9C3B7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="70" y1="266" x2="290" y2="266"/>
    <polyline points="281,259 293,266 281,273"/>
  </g>
</svg>
