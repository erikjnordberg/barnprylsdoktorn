<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-label="Två barn framifrån i bakåtvänd bilbarnstol. Till vänster rätt: internbältet löper rakt ut från eller strax ovanför axlarna. Till höger fel: bältet kommer ut under axelhöjd.">

  <g font-family="Source Sans 3, system-ui, sans-serif">

    <!-- Avdelare -->
    <line x1="180" y1="70" x2="180" y2="196" stroke="#A8A29A" stroke-width="1" fill="none"/>

    <!-- ===== RÄTT: selen i eller strax ovanför axelhöjd ===== -->
    <g>
      <line x1="34" y1="134" x2="156" y2="134" stroke="#A8A29A" stroke-width="1.5"
            stroke-dasharray="4 3" fill="none"/>
      <rect x="57" y="122" width="76" height="76" rx="10" fill="none"
            stroke="#181614" stroke-width="5"/>
      <circle cx="95" cy="98" r="20" fill="#B5581F" stroke="#F7F5F2" stroke-width="4"/>
      <!-- Selöppningar, strax ovanför axelhöjd -->
      <line x1="52" y1="126" x2="70" y2="126" stroke="#B5581F" stroke-width="7"
            stroke-linecap="round"/>
      <line x1="120" y1="126" x2="138" y2="126" stroke="#B5581F" stroke-width="7"
            stroke-linecap="round"/>
    </g>
    <text x="95" y="224" font-size="13.5" font-weight="600" fill="#181614" text-anchor="middle">Rätt</text>
    <text x="95" y="242" font-size="11.5" fill="#6b6459" text-anchor="middle">rakt ut från eller strax ovanför</text>

    <!-- ===== FEL: selen under axelhöjd ===== -->
    <g>
      <line x1="204" y1="134" x2="326" y2="134" stroke="#A8A29A" stroke-width="1.5"
            stroke-dasharray="4 3" fill="none"/>
      <rect x="227" y="122" width="76" height="76" rx="10" fill="none"
            stroke="#181614" stroke-width="5"/>
      <circle cx="265" cy="98" r="20" fill="#B5581F" stroke="#F7F5F2" stroke-width="4"/>
      <!-- Selöppningar, för långt under axelhöjd -->
      <line x1="222" y1="156" x2="240" y2="156" stroke="#181614" stroke-width="7"
            stroke-linecap="round"/>
      <line x1="290" y1="156" x2="308" y2="156" stroke="#181614" stroke-width="7"
            stroke-linecap="round"/>
      <!-- Avstånd ned till selen, markerat -->
      <line x1="265" y1="136" x2="265" y2="154" stroke="#A8A29A" stroke-width="1.5"
            stroke-dasharray="3 2" fill="none"/>
    </g>
    <text x="265" y="224" font-size="13.5" font-weight="600" fill="#181614" text-anchor="middle">Fel</text>
    <text x="265" y="242" font-size="11.5" fill="#6b6459" text-anchor="middle">under axelhöjd</text>

    <!-- Teckenförklaring -->
    <line x1="30" y1="70" x2="48" y2="70" stroke="#A8A29A" stroke-width="1.5"
          stroke-dasharray="4 3" fill="none"/>
    <text x="54" y="74" font-size="11" fill="#6b6459">Axelhöjd · bakåtvänd stol</text>

  </g>
</svg>
